[package]
name = "halbach-instruments"
version = "0.1.0"
edition = "2021"
description = "Native Rust instrument service for the Halbach Hall workstation"

[lib]
path = "src/lib.rs"

[[bin]]
name = "halbach-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
rand = "0.8"
time = { version = "0.3", features = ["formatting"] }
