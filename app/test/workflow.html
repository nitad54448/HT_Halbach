<!doctype html><meta charset="utf-8"><title>Workstation workflow smoke tests</title>
<pre id="results">RUNNING</pre><iframe id="app" src="../index.html" style="width:1400px;height:900px"></iframe>
<script>
'use strict';
document.getElementById('app').addEventListener('load', async () => {
  const frame=document.getElementById('app'),w=frame.contentWindow,d=frame.contentDocument,results=[];
  const assert=(v,m)=>{if(!v)throw Error(m);results.push(m);};
  const change=(el,value)=>{el.value=value;el.dispatchEvent(new w.Event('change',{bubbles:true}));};
  const loadFile=async text=>{await d.getElementById('preset-file').onchange({target:{files:[new w.File([text],'test.preset.json',{type:'application/json'})],value:''}});};
  const preset=async name=>{d.querySelector('#p-hardware [data-release-config]').click();d.getElementById('tabs').querySelector('[data-id="mode"]').click();await loadFile(await (await w.fetch('presets/'+name+'.json')).text());};
  try {
    w.confirm=()=>true;
    const requests=[];
    w.HHHardware={checkDevice:async device=>{requests.push(device);return {ok:true,identity:device.model};}};
    assert(d.getElementById('p-mode').classList.contains('active'),'Method opens first');
    assert(!d.getElementById('preset-choice')&&!d.getElementById('load-preset')&&!d.querySelector('#p-mode h1'),'Removed preset selector, toolbar button and page title');
    assert(d.querySelectorAll('#mode-cards .mode-card').length===4,'Method page has four cards');
    const file=d.getElementById('preset-file');let pickerOpened=false;file.click=()=>{pickerOpened=true;};
    d.getElementById('preset-card').click();assert(pickerOpened&&file.hidden,'Fourth card opens the hidden JSON picker');
    assert(d.querySelector('[data-bind="method.lock_timeout_s"]').closest('#p-temp'),'TTL timeout is in Experiment setup');
    assert(!d.querySelector('#p-mode input[type="number"]'),'Method contains no numerical parameters');
    assert([...d.getElementById('x-fixed').options].map(o=>o.value).join(',')==='dc,ac','Excitation offers only DC and AC current');
    await preset('dc-delta');
    assert(w.HH.debugState().P.method.fixed.excitation==='dc'&&w.HH.debugState().P.hardware.measure.dc_mode==='delta','Legacy delta preset becomes DC excitation with delta device wiring');
    const reverse=d.querySelector('[data-bind="method.fixed.reverse"]');
    assert(reverse.closest('.field').hidden,'Delta hides manual reversal');
    d.getElementById('next').click();
    assert(!d.getElementById('check-connections').disabled,'Configured addresses enable CHECK');
    assert(d.querySelector('[data-bind="hardware.measure.volt_addr"]').closest('.field').hidden,'Delta hides standalone voltmeter address');
    await d.getElementById('check-connections').onclick();
    assert(requests.some(r=>r.role==='voltmeter'&&r.parent==='source'),'Delta checks voltmeter through source');
    assert(!d.getElementById('next').disabled,'Successful checks unlock Sample');
    assert(d.getElementById('x-fixed').disabled&&d.querySelector('[data-bind="hardware.source.address"]').disabled,'Validated Method and Devices are read only');
    change(d.querySelector('[data-bind="method.fixed.I_mA"]'),'2');
    assert(w.HH.debugState().connectionsOk(),'Parameter edits preserve device validation');
    let savedBlob;
    w.URL.createObjectURL=blob=>{savedBlob=blob;return 'blob:test-preset';};w.URL.revokeObjectURL=()=>{};
    w.HTMLAnchorElement.prototype.click=function(){};
    d.getElementById('save-preset').click();
    const savedText=await savedBlob.text(),saved=JSON.parse(savedText);
    assert(saved.format==='halbach-hall-preset'&&saved.method.fixed.excitation==='dc'&&saved.hardware.measure.dc_mode==='delta'&&saved.hardware.source.model==='K6221','Devices exports method and devices in one preset JSON');
    assert(!('runs' in saved)&&!('sample' in saved),'Preset excludes measurement data and sample');
    d.querySelector('#p-hardware [data-release-config]').click();
    change(d.querySelector('[data-bind="hardware.source.address"]'),'');
    assert(d.getElementById('check-connections').disabled,'Missing source address disables CHECK');
    assert(d.getElementById('next').disabled,'Configuration changes invalidate old checks');
    await loadFile(savedText);
    assert(w.HH.debugState().P.hardware.source.address===saved.hardware.source.address,'Saved preset restores device addresses');
    await preset('ac-dc');
    assert(!d.getElementById('f-dc-currents').closest('.field').hidden,'AC field/DC current shows current list');
    assert(d.querySelector('[data-bind="method.rotating.background"]').closest('.field').hidden,'DC sweep hides separate background option');
    change(d.getElementById('f-dc-currents'),'-5, -2.5, 0, 2.5, 5');
    assert(w.HH.debugState().P.method.rotating.currents_mA.length===5,'Signed current list is parsed');
    change(d.querySelector('[data-bind="method.rotating.rot_hz"]'),'1.3');
    assert(w.HH.modeErrors(w.HH.debugState().P).some(e=>/1.2/.test(e)),'Experiment validation rejects rotation above 1.2 Hz');
    await preset('chirp');
    assert(w.HH.debugState().P.method.rot_hz===1.2&&w.HH.debugState().P.method.cycles===6,'CHIRP preset uses maximum speed and cycle count');
    assert(!d.getElementById('next').disabled,'Valid CHIRP parameters unlock Devices');
    await preset('dc-delta');
    const p=w.HH.debugState().P;
    p.hardware.magnet.counts_per_turn=4000;p.hardware.magnet.velocity_scale=1;p.tempProgram=[w.HH.makeStep('measure')];
    d.getElementById('next').click();await d.getElementById('check-connections').onclick();
    const synthetic=await w.HH.acquire(p,{},()=>295,5);
    w.HHHardware.startProgram=async()=>({id:'browser-test-only'});
    w.HHHardware.programStatus=async()=>({state:'finished',step:0,count:1,message:'Fake transport program complete',temperatureK:null,setpointK:null,runs:[{samples:synthetic.samples,simulated:false,T_mean:null,T_set:null,positionSource:'owis',detectionKind:'angular'}]});
    d.getElementById('tabs').querySelector('[data-id="run"]').click();
    assert(!d.getElementById('r-start').disabled,'Calibrated real configuration enables Start');
    await d.getElementById('r-start').onclick();
    assert(p.runs.length===1&&!p.runs[0].simulated,'Real backend results retain their acquisition flag');
    assert(p.runs[0].fit&&p.runs[0].derived,'Real angular data reaches analysis');
    assert(!w.HH.debugState().running,'Real run completion unlocks controls');
    p.tempProgram.push(w.HH.makeStep('soak'));
    let state='running',updates=[],polls=0,updatedProgram;
    w.HHHardware.programStatus=async()=>{polls++;return {state,step:0,count:0,message:state,runs:[]};};
    w.HHHardware.pauseProgram=async()=>{state='paused';};
    w.HHHardware.resumeProgram=async()=>{state='running';};
    w.HHHardware.updateProgram=async(id,project)=>{updates.push(JSON.parse(JSON.stringify(project.method)));updatedProgram=JSON.parse(JSON.stringify(project.tempProgram));};
    const live=d.getElementById('r-start').onclick();
    while(!polls)await new Promise(r=>setTimeout(r,5));
    assert(d.getElementById('x-fixed').disabled,'Method locks during acquisition');
    d.querySelector('#tabs [data-id="temp"]').click();
    assert(d.querySelector('[data-step-index="0"]').disabled&&!d.querySelector('[data-step-index="1"]').disabled,'Only future temperature step parameters remain editable');
    change(d.querySelector('[data-step-index="1"]'),'15');
    const current=d.querySelector('[data-bind="method.fixed.I_mA"]');
    assert(!current.disabled,'Experimental current stays editable during acquisition');
    change(current,'3');
    assert(!updates.length,'Editing a parameter does not silently change active acquisition');
    await d.getElementById('apply-parameters').onclick();
    assert(updates.length===1&&updates[0].fixed.I_mA===3,'Apply sends edited parameters to the running Rust job');
    assert(updatedProgram[1].seconds===15,'Apply includes future temperature parameters');
    await d.getElementById('r-pause').onclick();
    while(w.HH.debugState().runner.state!=='paused')await new Promise(r=>setTimeout(r,10));
    assert(!d.getElementById('x-fixed').disabled&&!d.querySelector('[data-bind="hardware.source.address"]').disabled,'Pause unlocks Method and Devices');
    change(d.querySelector('[data-bind="hardware.source.address"]'),'GPIB0::15::INSTR');
    assert(!w.HH.debugState().connectionsOk()&&d.getElementById('r-pause').disabled,'Changed paused devices require validation before Resume');
    await d.getElementById('check-connections').onclick();
    await d.getElementById('r-pause').onclick();
    assert(d.getElementById('x-fixed').disabled,'Resume relocks configuration');
    state='finished';await live;
    assert(!d.getElementById('x-fixed').disabled,'Stop or completion releases configuration');
    document.getElementById('results').textContent='PASS '+results.length+' workflow checks\n'+results.join('\n');
  }catch(e){document.getElementById('results').textContent='FAIL '+e.stack;}
});
</script>
